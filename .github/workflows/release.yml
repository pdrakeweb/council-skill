name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # build.sh already refuses to package on a naming, description or
      # version-stamp problem, so building IS the validation step.
      - name: Build
        id: build
        run: |
          set -euo pipefail
          bash build.sh --zip
          v=$(sed -n 's/.*SKILL_VERSION[[:space:]]*=[[:space:]]*"\([0-9.]*\)".*/\1/p' council/VERSION | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Both stamps already agree (build.sh enforces that); this catches a tag
      # that disagrees with them.
      - name: Check the tag matches the skill version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          if [ "$tag" != "${{ steps.build.outputs.version }}" ]; then
            echo "Tag v$tag does not match council version ${{ steps.build.outputs.version }}" >&2
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail
          notes=$(cat <<'NOTES'
          Install as a Claude Code plugin:

          ```
          /plugin marketplace add pdrakeweb/council-skill
          /plugin install council@pdrakeweb-council
          ```

          Or download `council.zip` below and upload it via
          **Settings → Capabilities → Skills → Upload a skill**.
          NOTES
          )
          gh release create "$TAG" council.skill council.zip \
            --title "council v$VERSION" \
            --notes "$notes" || \
          gh release upload "$TAG" council.skill council.zip --clobber
